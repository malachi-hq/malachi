# MirrorMaker 2's API needs (#166): two single-node Kafka clusters in KRaft mode, a source and a target,
# whose request loggers record every request a client makes, and MirrorMaker 2 copying a topic and a
# consumer group's offsets from one to the other. mm2.sh drives it, then points MirrorMaker 2 at the
# spike instead of the Kafka target. Nothing is published on the host.
x-kafka: &kafka
  image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
  cpuset: "${SRV_CPUSET:-1,2,3}"
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 3s
    timeout: 10s
    retries: 40

x-kafka-env: &kafka-env
  KAFKA_NODE_ID: 1
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
  # every request, with its API key, version and client id, in the broker's log
  KAFKA_LOG4J_LOGGERS: kafka.request.logger=DEBUG

services:
  src:
    <<: *kafka
    hostname: src
    environment:
      <<: *kafka-env
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://src:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@src:9093

  dst:
    <<: *kafka
    hostname: dst
    environment:
      <<: *kafka-env
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://dst:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@dst:9093

  mm2:
    profiles: [mm2]
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    cpuset: "${LT_CPUSET:-0}"
    environment:
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    volumes:
      - ./mm2:/mm2:ro
    entrypoint: ["/opt/kafka/bin/connect-mirror-maker.sh", "/mm2/${MM2_PROPERTIES:-mm2.properties}"]
