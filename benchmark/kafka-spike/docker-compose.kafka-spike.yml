# The Kafka spike harness (#166): one Malachi node with the spike's Kafka listener on, and the clients that
# drive it. Started per case by clients.sh and overhead.sh, which recreate the node every time so each case
# starts from an empty log.
#
# The image is the repository's own Dockerfile (built once as malachi-166-kafka-spike:dev), so the spike
# runs exactly what CI would build, NIFs included. Nothing is published on the host: clients reach the
# node by its service name on the compose network.
services:
  malachi:
    image: ${SPIKE_IMAGE:-malachi-166-kafka-spike:dev}
    hostname: malachi
    # root only so the capture directory, a host bind mount, is writable whatever its owner
    user: "0:0"
    cpuset: "${SRV_CPUSET:-1,2,3}"
    environment:
      # The measurement regime of docker-compose.bench.yml, so both wires run on the node the published
      # numbers come from: schedulers matched to the pinned cores, group commit on a one-member control
      # plane (replication factor 1), admission limits off, data on tmpfs with no preallocation.
      - ERL_FLAGS=${SRV_ERL_FLAGS:-+S 3:3}
      - MALACHI_GROUP_COMMIT=true
      - MALACHI_LOG_REPLICATION_FACTOR=1
      - MALACHI_GROUP_COMMIT_INTERVAL_MS=2
      - MALACHI_RATE_LIMIT_ENABLED=false
      - MALACHI_CONNECTION_LIMIT_ENABLED=false
      - MALACHI_SEGMENT_PREALLOC_BYTES=0
      - MALACHI_TCP_PORT=4040
      - MALACHI_ADVERTISED_HOST=malachi
      - MALACHI_ADVERTISED_PORT=4040
      - MALACHI_DASHBOARD_PORT=4041
      - MALACHI_CONSOLE_ENABLED=false
      - MALACHI_LOCALE=en_US
      - MALACHI_REQUIRE_TLS=false
      - MALACHI_ADMIN_PASS=malachi-local-only-admin
      - MALACHI_PRODUCER_PASS=malachi-local-only-producer
      - MALACHI_CONSUMER_PASS=malachi-local-only-consumer
      - MALACHI_APP_PASS=malachi-local-only-app
      - MALACHI_RA_DATA_DIR=/app/data/ra
      - MALACHI_LOG_DATA_DIR=/app/data/log
      # the spike: on, on every interface of the compose network, advertised by service name
      - MALACHI_KAFKA_SPIKE_PORT=9092
      - MALACHI_KAFKA_SPIKE_IP=0.0.0.0
      - MALACHI_KAFKA_SPIKE_ADVERTISED_HOST=malachi
      - MALACHI_KAFKA_SPIKE_TOPIC=kafka-spike
      - MALACHI_KAFKA_SPIKE_IDEMPOTENCE=${SPIKE_IDEMPOTENCE:-hide}
      - MALACHI_KAFKA_SPIKE_CAPTURE_DIR=/capture
    volumes:
      - ${SPIKE_CAPTURE_DIR:-./results/capture}:/capture
    tmpfs:
      - /app/data:rw,size=1g
      - /tmp:rw
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4041/health"]
      interval: 2s
      timeout: 2s
      retries: 60

  java39:
    profiles: [clients]
    build:
      context: ./java
      args:
        KAFKA_IMAGE: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    image: malachi-166-kafka-spike-java:3.9.2
    cpuset: "${LT_CPUSET:-0}"

  java44:
    profiles: [clients]
    build:
      context: ./java
      args:
        KAFKA_IMAGE: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    image: malachi-166-kafka-spike-java:4.4.0
    cpuset: "${LT_CPUSET:-0}"

  kcat:
    profiles: [clients]
    image: confluentinc/cp-kcat:8.2.4@sha256:1c350ab3a06825d94bd9715e161b0fbc06d884e0e166ecf0a8c80cf9e99c305e
    entrypoint: ["/bin/sh", "-c"]
    cpuset: "${LT_CPUSET:-0}"

  # the Elixir load generator (mix malachi.loadtest), for overhead.sh: --wire malachi or --wire kafka
  loadtest:
    profiles: [overhead]
    build:
      context: ../..
      dockerfile: benchmark/Dockerfile.loadtest
    image: malachi-166-kafka-spike-loadtest:dev
    cpuset: "${LT_CPUSET:-0}"
