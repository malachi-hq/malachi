<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A topic changes shape under its clients">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00d9ff"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b96c4"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3ddc97"/></marker></defs>
<rect width="1200" height="675" fill="#0a0e27"/>
<g font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif">
<text x="60" y="78" font-size="38" font-weight="600" fill="#ffffff">A topic changes shape under its clients</text>
<text x="60" y="118" font-size="22" fill="#8b96c4">An operator splits a range while producers keep writing and consumers keep their place.</text>
<rect x="60" y="170" width="430" height="300" rx="14" fill="#121a3d" stroke="#2a3566" stroke-width="2"/>
<text x="90" y="215" font-size="26" font-weight="600" fill="#00d9ff" text-anchor="start">range A</text>
<text x="90" y="248" font-size="20" font-weight="400" fill="#8b96c4" text-anchor="start">keys 0 to 99</text>
<rect x="90" y="280" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="130" y="280" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="170" y="280" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="210" y="280" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="250" y="280" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="290" y="280" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="330" y="280" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="370" y="280" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="410" y="280" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/>
<text x="90" y="355" font-size="20" font-weight="400" fill="#8b96c4" text-anchor="start">records in order, one log</text>
<polygon points="347,330 337,350 357,350" fill="#ffb454"/>
<text x="90" y="410" font-size="20" font-weight="400" fill="#8b96c4" text-anchor="start">consumer position:</text>
<text x="275" y="410" font-size="20" font-weight="600" fill="#ffb454" text-anchor="start">an opaque token in A</text>
<text x="90" y="445" font-size="18" font-weight="400" fill="#8b96c4" text-anchor="start">(it never computes an offset)</text>
<line x1="510" y1="320" x2="630" y2="320" stroke="#00d9ff" stroke-width="3" marker-end="url(#a)"/>
<text x="570" y="300" font-size="22" font-weight="600" fill="#00d9ff" text-anchor="middle">split</text>
<rect x="650" y="170" width="490" height="140" rx="14" fill="#121a3d" stroke="#2a3566" stroke-width="2"/>
<text x="680" y="212" font-size="26" font-weight="600" fill="#00d9ff" text-anchor="start">range B</text>
<text x="800" y="212" font-size="20" font-weight="400" fill="#8b96c4" text-anchor="start">keys 0 to 49</text>
<rect x="680" y="232" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.35"/><rect x="720" y="232" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.35"/><rect x="760" y="232" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.35"/><rect x="800" y="232" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.35"/>
<rect x="840" y="232" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="880" y="232" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="920" y="232" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/>
<text x="680" y="292" font-size="18" font-weight="400" fill="#8b96c4" text-anchor="start">history: A, then B</text>
<text x="960" y="292" font-size="18" font-weight="600" fill="#ffb454" text-anchor="start">accepts the token</text>
<rect x="650" y="330" width="490" height="140" rx="14" fill="#121a3d" stroke="#2a3566" stroke-width="2"/>
<text x="680" y="372" font-size="26" font-weight="600" fill="#00d9ff" text-anchor="start">range C</text>
<text x="800" y="372" font-size="20" font-weight="400" fill="#8b96c4" text-anchor="start">keys 50 to 99</text>
<rect x="680" y="392" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.35"/><rect x="720" y="392" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.35"/><rect x="760" y="392" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.35"/><rect x="800" y="392" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.35"/>
<rect x="840" y="392" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="880" y="392" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/><rect x="920" y="392" width="34" height="34" rx="5" fill="#00d9ff" fill-opacity="0.85"/>
<text x="680" y="452" font-size="18" font-weight="400" fill="#8b96c4" text-anchor="start">history: A, then C</text>
<text x="960" y="452" font-size="18" font-weight="600" fill="#ffb454" text-anchor="start">accepts the token</text>
<text x="60" y="540" font-size="22" font-weight="400" fill="#ffffff" text-anchor="start">A split only extends a range's history, so a token read in A names the same record in B and C.</text>
<text x="60" y="575" font-size="20" font-weight="400" fill="#8b96c4" text-anchor="start">The consumer resumes where it was. It may read its share of A again, at least once, and it never loses a record.</text>
<text x="60" y="625" font-size="18" font-weight="400" fill="#8b96c4" text-anchor="start">Faded: the records B and C inherit from A.   Bright: what producers wrote after the split.</text>
</g>
</svg>
