name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily security scan at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sobelow:
    name: Sobelow Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '28.1'
          elixir-version: '1.19.4'

      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-security-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-security-

      - name: Install dependencies
        run: |
          # Retry: the Hex registry occasionally drops the connection mid-fetch (transient, and worse on a
          # cache miss when every dep downloads at once). Fail only if all attempts fail.
          for i in 1 2 3; do
            mix deps.get && exit 0
            echo "mix deps.get failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      # Neither command passes --exit: a bare --exit means "low", and sobelow lets the command line
      # win over the file, so passing it here would silently override the policy in .sobelow-conf and
      # fail the build on the 29 low findings that file explains we accept. The threshold lives in the
      # config and nowhere else. The first run writes the artifact and is allowed to fail; the second
      # is the gate.
      - name: Run Sobelow
        run: |
          mix sobelow --config --format json --out sobelow-results.json || true
          mix sobelow --config

      - name: Upload Sobelow results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sobelow-results
          path: sobelow-results.json

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '28.1'
          elixir-version: '1.19.4'

      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-security-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-security-

      - name: Install dependencies
        run: |
          # Retry: the Hex registry occasionally drops the connection mid-fetch (transient, and worse on a
          # cache miss when every dep downloads at once). Fail only if all attempts fail.
          for i in 1 2 3; do
            mix deps.get && exit 0
            echo "mix deps.get failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      - name: Check for vulnerable dependencies
        run: mix deps.audit

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Check for outdated dependencies
        run: mix hex.outdated
        continue-on-error: true

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trivy-scan:
    name: Trivy Security Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy (table output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # Pull requests as well as pushes to main, for two reasons. The obvious one is that a scan which
    # only runs after the merge cannot stop anything: a vulnerable base image reaches main first and
    # is reported second. The subtler one is that this job's SARIF upload registers a code-scanning
    # configuration of its own (no `category` input is given, so the key is workflow:job), and GitHub
    # expects every configuration it has seen on main to reappear on a pull request. While this job
    # was gated to pushes, that configuration never came back, and code scanning answered every PR
    # with `1 configuration not found` and gave up computing which Trivy alerts the PR introduced,
    # for BOTH configurations. Running here restores that comparison as a side effect.
    #
    # A manual run belongs here too: someone dispatching this workflow by hand is usually acting on a
    # suspicion, and an audit that quietly leaves out the image scan answers a question it never
    # actually asked. A missing scan is worse than a slow one, because it does not announce itself.
    #
    # Deliberately NOT on the nightly schedule: that run scans the source tree, and adding an image
    # build to it buys a rebuild of unchanged code most nights.
    #
    # Spelled out rather than written as `!= 'schedule'`. The two are equivalent today, since
    # `on.push.branches` already restricts pushes to main, but the negative form opts any future
    # trigger into this job by default, and the ref check is what holds if `on.push.branches` is ever
    # widened.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: malachi:security-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'malachi:security-test'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: 'trivy-docker-results.sarif'

  shell-hygiene:
    name: Shell Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap and specific on purpose: it asks one question, "does any entrypoint download something and
      # feed it straight to an interpreter", which is what scripts/setup-dev.sh used to do (issue #69). The
      # safe form is longer than the unsafe one, so a comment alone would not survive a tidy-up.
      - name: Check for downloads piped into a shell
        run: ./scripts/check-no-pipe-to-shell.sh

  security-summary:
    name: Security Summary
    # docker-scan included: it runs on every pull request now, and a table headed Security Scan
    # Results that omits one of the scans is worse than no table. `always()` keeps this job running
    # when that one is skipped (the nightly), and the row then reads `skipped`, which is the honest
    # answer rather than a gap.
    needs: [sobelow, dependency-audit, secret-scanning, trivy-scan, docker-scan, shell-hygiene]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Summary
        run: |
          {
            echo "## Security Scan Results"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Sobelow | ${{ needs.sobelow.result }} |"
            echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |"
            echo "| Secret Scanning | ${{ needs.secret-scanning.result }} |"
            echo "| Trivy Scan (filesystem) | ${{ needs.trivy-scan.result }} |"
            echo "| Docker Image Scan | ${{ needs.docker-scan.result }} |"
            echo "| Shell Hygiene | ${{ needs.shell-hygiene.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
