name: Pages

on:
  workflow_run:
    workflows: [Publish results]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.head_branch == 'main' }}

    permissions:
      contents: read

    env:
      MIX_ENV: dev

    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: 🔧 Setup Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .github/beam-versions
          version-type: strict

      - name: 📦 Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-docs-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-docs-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: 🔨 Install dependencies
        run: |
          # Retry: the Hex registry occasionally drops the connection mid-fetch (transient, and worse on a
          # cache miss when every dep downloads at once). Fail only if all attempts fail.
          for i in 1 2 3; do
            mix deps.get && exit 0
            echo "mix deps.get failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      - name: 📝 Generate documentation
        run: mix docs

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
