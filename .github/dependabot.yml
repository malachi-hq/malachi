version: 2
updates:
  # Elixir / Hex dependencies
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Every dependency PR lands on the maintainer, so an update cannot sit unowned: these arrive on a
    # schedule rather than from a person, which is exactly how a PR ends up with nobody looking at it.
    assignees:
      - "HectorIFC"
    commit-message:
      prefix: "chore(deps):"
    # Shaped the way the dependency-updates skill (.claude/skills/dependency-updates) processes the queue,
    # and checked against its table (scripts/deps_check.exs) by test/scripts/dependency_updates_skill_test.exs.
    # ra matches no group on purpose: every control plane store runs on it, so it always arrives alone and
    # is verified with the multinode suite and the drills. update-types keeps majors out of both groups, so
    # a major arrives as a pull request of its own, which is a decision and not a bump.
    groups:
      hex-auth:
        patterns:
          - "joken"
          - "jose"
          - "argon2_elixir"
        update-types:
          - "minor"
          - "patch"
      hex:
        patterns:
          - "*"
        exclude-patterns:
          - "ra"
          - "joken"
          - "jose"
          - "argon2_elixir"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "dependencies"
    assignees:
      - "HectorIFC"
    commit-message:
      prefix: "chore(ci):"
    # One pull request for every action, majors included: an action's tag is its major, so a bump is
    # almost always one, and the skill applies the group to every workflow on main and pins it by SHA.
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images, pinned by digest in the Dockerfiles. Without this entry the digests never move on their own.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/benchmark"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    assignees:
      - "HectorIFC"
    commit-message:
      prefix: "chore(docker):"

  # The OCI reference example's providers and lock files (deploy/terraform/oci-always-free). Each root has its own
  # lock file, so both directories are listed. Provider and lock changes arrive as pull requests, never by hand.
  - package-ecosystem: "terraform"
    directories:
      - "/deploy/terraform/oci-always-free/cluster"
      - "/deploy/terraform/oci-always-free/orchestrator"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    assignees:
      - "HectorIFC"
    commit-message:
      prefix: "chore(deps):"
